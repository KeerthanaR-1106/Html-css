<html>
<head>
 
  <title>Chat UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-wrapper {
      width: 360px;
      max-width: 100%;
      height: 640px;
      max-height: 100vh;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

  
    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid #e3e5ea;
      background: #ffffff;
    }

    .chat-header .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }

    .chat-header .info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .chat-header .info .name {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
    }

    .chat-header .info .status {
      font-size: 12px;
      color: #6b7280;
    }

    .chat-header .actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: none;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 14px;
      cursor: default;
    }

   
    .chat-body {
      flex: 1;
      padding: 12px 12px 8px;
      background: #e5e7eb;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      max-width: 80%;
    }

    .msg-row.me {
      margin-left: auto;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #9ca3af;
      flex-shrink: 0;
    }

    .msg-bubble {
      padding: 8px 10px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.35;
      position: relative;
      background: #ffffff;
      color: #111827;
    }

    .msg-row.me .msg-bubble {
      background: #4f46e5;
      color: #f9fafb;
      border-bottom-right-radius: 4px;
    }

    .msg-row.them .msg-bubble {
      border-bottom-left-radius: 4px;
    }

    .msg-meta {
      margin-top: 3px;
      font-size: 11px;
      color: #9ca3af;
      text-align: right;
    }

    .msg-row.them .msg-meta {
      text-align: left;
    }

    .chat-input {
      border-top: 1px solid #e3e5ea;
      background: #ffffff;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-input .icon {
      font-size: 18px;
      color: #6b7280;
      cursor: default;
    }

    .chat-input input {
      flex: 1;
      border: none;
      outline: none;
      background: #f3f4f6;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
    }

    .chat-input button.send-btn {
      border: none;
      outline: none;
      border-radius: 999px;
      padding: 7px 12px;
      background: #4f46e5;
      color: #f9fafb;
      font-size: 13px;
      font-weight: 500;
      cursor: default;
    }

    @media (max-width: 480px) {
      body {
        align-items: stretch;
        height: 100vh;
      }
      .chat-wrapper {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
  
    <div class="chat-header">
      <div class="avatar"></div>
      <div class="info">
        <span class="name">Priya</span>
        <span class="status">online · typing…</span>
      </div>
      <div class="actions">
        <button class="icon-btn">🔍</button>
        <button class="icon-btn">⋮</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-body">
      <div class="msg-row them">
        <div class="msg-avatar"></div>
        <div>
          <div class="msg-bubble">
            Hello! How are you?
          </div>
          <div class="msg-meta">09:12</div>
        </div>
      </div>

      <div class="msg-row me">
        <div class="msg-avatar"></div>
        <div>
          <div class="msg-bubble">
            I an fine.What about you?
          </div>
          <div class="msg-meta">09:13 ✓✓</div>
        </div>
      </div>

      <div class="msg-row them">
        <div class="msg-avatar"></div>
        <div>
          <div class="msg-bubble">
            I am doing great.
          </div>
          <div class="msg-meta">09:14</div>
        </div>
      </div>
    </div>
    <div class="chat-input">
      <span class="icon">😊</span>
      <input type="text" placeholder="Type a message…" />
      <button class="send-btn">Send</button>
    </div>
  </div>
</body>
</html>
